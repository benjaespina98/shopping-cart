<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Arranca los pedidos más urgentes de la portada (proyectos, para saber qué foto
         va en el hero; settings, para WhatsApp/horarios) apenas el navegador tiene este
         HTML — antes de que el bundle de React termine de bajar, parsear y montar.
         React los consume en cuanto arranca (ver src/utils/prefetch.js); si ya no están
         disponibles (SPA, ruta distinta, o esto falló) cada componente vuelve a pedirlos
         como antes. En un cold start del backend, esto adelanta el pedido varios cientos
         de ms — justo el tiempo que la foto del hero se veía como placeholder vacío.
         Vive en /prefetch.js (y no inline) para que la CSP pueda exigir script-src 'self'
         sin 'unsafe-inline'. -->
    <script src="/prefetch.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Piscinas de hormigón y de fibra INDUPLAST, revestimientos, cercos, cobertores, climatización y accesorios. Más de 30 años en Villa María, Córdoba." />
    <meta name="robots" content="index, follow" />
    <title>Playa &amp; Sol Piscinas | Piscinas en Villa María, Córdoba</title>
    <link rel="canonical" href="https://playaysol.vercel.app/" />
    <meta name="theme-color" content="#244B5A" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Playa &amp; Sol Piscinas | Piscinas en Villa María, Córdoba" />
    <meta property="og:description" content="Piscinas de hormigón y de fibra INDUPLAST, revestimientos, cercos, cobertores, climatización y accesorios. Más de 30 años en Villa María, Córdoba." />
    <meta property="og:url" content="https://playaysol.vercel.app/" />
    <meta property="og:site_name" content="Playa &amp; Sol Piscinas" />
    <meta property="og:locale" content="es_AR" />
    <!-- Tarjeta 1200x630 (relación 1.91:1): con el logo apilado de 1032x840 las redes recortaban arriba y abajo. -->
    <meta property="og:image" content="https://playaysol.vercel.app/brand/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Playa &amp; Sol Piscinas, Villa María" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Playa &amp; Sol Piscinas | Piscinas en Villa María, Córdoba" />
    <meta name="twitter:description" content="Piscinas de hormigón y de fibra INDUPLAST, revestimientos, cercos, cobertores, climatización y accesorios. Más de 30 años en Villa María, Córdoba." />
    <meta name="twitter:image" content="https://playaysol.vercel.app/brand/og-image.png" />
    <!-- Datos estructurados: bloque de datos (no se ejecuta), así que la CSP con
         script-src 'self' no lo afecta. Solo lleva datos que ya existen en el código del
         sitio (Contact.jsx, SettingsContext.jsx): ver docs/SEO.md. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://playaysol.vercel.app/#negocio",
        "name": "Playa & Sol Piscinas",
        "url": "https://playaysol.vercel.app/",
        "description": "Piscinas de hormigón y de fibra INDUPLAST, revestimientos, cercos, cobertores, climatización y accesorios en Villa María, Córdoba. Más de 30 años de trayectoria.",
        "logo": "https://playaysol.vercel.app/brand/logo-stacked.png",
        "image": "https://playaysol.vercel.app/brand/og-image.png",
        "areaServed": { "@type": "City", "name": "Villa María" },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Líneas de trabajo",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Piscinas de hormigón" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Piscinas de fibra INDUPLAST" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Revestimientos" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cercos perimetrales" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cobertores" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Climatización" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Accesorios para piscinas" } }
          ]
        },
        "telephone": "+543534224605",
        "email": "piscinas@playaysol.com.ar",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Corrientes 1210",
          "addressLocality": "Villa María",
          "addressRegion": "Córdoba",
          "addressCountry": "AR"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -32.41136540202374,
          "longitude": -63.24136445912394
        },
        "sameAs": [
          "https://www.instagram.com/playaysol.piscinas/",
          "https://www.facebook.com/playaysol.piscinas",
          "https://www.tiktok.com/@playaysolpiscinas"
        ]
      }
    </script>
    <!-- La imagen del Hero se sirve desde Cloudinary; abrimos la conexión cuanto antes
         para que la foto principal descargue lo más rápido posible en el primer render -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- Tipografías propias (Quicksand de marca, Mulish para texto corrido): se empaquetan desde
         @fontsource-variable en src/index.css y vite.config.js (plugin fontPreload) agrega acá el
         <link rel="preload"> del subset latin con el nombre con hash. Antes venían de Google Fonts: dos
         orígenes más, una hoja que bloqueaba el render y un salto de fuente al llegar. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Sin JavaScript la página quedaba en blanco: al menos el nombre y el contacto. Sin estilos en línea: la CSP (style-src 'self') los bloquearía. -->
    <noscript>
      <div>
        <h1>Playa &amp; Sol Piscinas</h1>
        <p>Piscinas en Villa María, Córdoba, con más de 30 años de trayectoria. Este sitio necesita JavaScript para mostrarse completo.</p>
        <p>Corrientes 1210, Villa María, Córdoba.<br />Teléfono: <a href="tel:+543534224605">3534224605</a><br />Email: <a href="mailto:piscinas@playaysol.com.ar">piscinas@playaysol.com.ar</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
